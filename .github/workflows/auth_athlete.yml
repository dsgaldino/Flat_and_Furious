name: Register Strava athlete

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Strava OAuth code or full redirect URL from athlete"
        required: true
        type: string
  repository_dispatch:
    types: [strava_auth]

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore athlete tokens
        uses: ./.github/actions/strava-tokens
        env:
          TOKENS_ATHLETES_B64: ${{ secrets.TOKENS_ATHLETES_B64 }}

      - name: Register athlete token
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          STRAVA_REDIRECT_URI: https://dsgaldino.github.io/Flat_and_Furious/strava/callback.html
        run: |
          CODE="${{ github.event.inputs.auth_code }}"
          if [ -z "$CODE" ]; then
            CODE="${{ github.event.client_payload.auth_code }}"
          fi
          if [ -z "$CODE" ]; then
            echo "No auth_code in workflow_dispatch or repository_dispatch payload"
            exit 1
          fi
          python -m flatfurious auth --code "$CODE"
