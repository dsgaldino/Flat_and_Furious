name: Register Strava athlete

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Strava OAuth code or full redirect URL from athlete"
        required: true
        type: string
  repository_dispatch:
    types: [strava_auth]

permissions:
  contents: write

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Register athlete token
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          STRAVA_REDIRECT_URI: https://dsgaldino.github.io/Flat_and_Furious/strava/callback.html
        run: |
          CODE="${{ github.event.inputs.auth_code }}"
          if [ -z "$CODE" ]; then
            CODE="${{ github.event.client_payload.auth_code }}"
          fi
          if [ -z "$CODE" ]; then
            echo "No auth_code in workflow_dispatch or repository_dispatch payload"
            exit 1
          fi
          python -m flatfurious auth --code "$CODE"

      - name: Commit tokens
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): register Strava athlete token"
          file_pattern: data/tokens_athletes.csv
