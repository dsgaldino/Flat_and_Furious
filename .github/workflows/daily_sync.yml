name: Daily Strava sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore athlete tokens
        uses: ./.github/actions/strava-tokens
        env:
          TOKENS_ATHLETES_B64: ${{ secrets.TOKENS_ATHLETES_B64 }}

      - name: Sync Strava data
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python -m flatfurious sync

      - name: Commit activity data (not tokens)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): daily Strava sync"
          file_pattern: |
            data/activities_all.csv
            data/activities_formatted.csv
